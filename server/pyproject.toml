[project]
name = "capture"
version = "0.1.0"
description = "AMCGH × NSU lung cancer study — photo-to-form data capture server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  "tzdata>=2024.1",
  "rapidfuzz>=3.9",
  "python-dateutil>=2.9",
]

[project.scripts]
capture = "capture.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "httpx>=0.27", "pgserver>=0.1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]
